<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furniture Designer</title>
<style>
@font-face { font-family: Barlow; font-weight: 400; src: url(lib/fonts/barlow-400.woff2) format('woff2'); }
@font-face { font-family: Barlow; font-weight: 500; src: url(lib/fonts/barlow-500.woff2) format('woff2'); }
@font-face { font-family: Barlow; font-weight: 600; src: url(lib/fonts/barlow-600.woff2) format('woff2'); }
:root {
  --ink: #20262a; --soft: #5c686e; --canvas: #e4e9e7; --panel: #fbfcfb; --line: #c7cfcc;
  --tape: #ffc928; --tape-deep: #e5a900; --danger: #b93a1a; --opening: #f6f8f7;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 15px/1.35 Barlow, 'Segoe UI', system-ui, sans-serif; color: var(--ink); background: var(--canvas); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }

#app { height: 100%; display: grid; grid-template: 52px minmax(0, 1fr) 34px / 76px minmax(0, 1fr) 292px; grid-template-areas: 'top top top' 'tools work side' 'foot foot foot'; }
#top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
#pname { font-weight: 600; font-size: 17px; width: 220px; border: 1px solid transparent; background: none; padding: 4px 6px; border-radius: 3px; }
#pname:hover { border-color: var(--line); }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
.grow { flex: 1; }
.btn { background: none; border: 1px solid transparent; border-radius: 3px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--canvas); }
.btn:disabled { color: #a3adb0; cursor: default; }
.btn.line { border-color: var(--line); background: #fff; }
.btn.main { background: var(--ink); color: #fff; font-weight: 500; padding: 7px 14px; }
.btn.main:hover:not(:disabled) { background: #39434a; }
.btn.bad { color: var(--danger); border-color: var(--line); background: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--ink); color: #fff; }

#tools { grid-area: tools; background: var(--panel); border-right: 1px solid var(--line); padding: 8px 6px; display: flex; flex-direction: column; gap: 3px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border: 0; border-radius: 3px; background: none; cursor: pointer; font-size: 13px; font-weight: 500; }
.tool:hover { background: var(--canvas); }
.tool[aria-pressed=true] { background: var(--tape); }
.tool svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1px; background: var(--line); min-height: 0; }
.pane { position: relative; background: var(--canvas); min-height: 0; min-width: 0; overflow: hidden; }
#hint { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: 14px; color: var(--soft); pointer-events: none; }
#unitTabs { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; gap: 4px; align-items: center; z-index: 2; }
.tab { border: 1px solid var(--line); background: #fff; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
.tab[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
#front { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
#front * { pointer-events: none; }
#view3d { position: absolute; inset: 0; }
#view3d canvas { display: block; }
#opts3d { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; align-items: center; }
#opts3d label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
#opts3d .btn { margin-left: auto; }

#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.field input[type=text], .field select { width: 112px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 3px; background: #fff; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; cursor: pointer; }
.big { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; margin: -4px 0 12px; }
.rowb { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.rowb .btn { flex: 1; }
.btn.on { background: var(--tape); border-color: var(--tape-deep); }
.swatches { display: flex; gap: 6px; margin-bottom: 8px; }
.sw { width: 34px; height: 34px; border-radius: 3px; border: 1px solid var(--soft); cursor: pointer; padding: 0; }
.sw[aria-pressed=true] { outline: 3px solid var(--tape-deep); outline-offset: 1px; }
.note { font-size: 13px; color: var(--soft); margin: 4px 0 10px; }

.gal { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.obj { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; background: var(--canvas); border: 1px solid transparent; border-radius: 3px; cursor: grab; font-size: 13px; touch-action: none; }
.obj:hover { border-color: var(--ink); }
.obj.on { background: var(--tape); border-color: var(--tape-deep); }
#objGhost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 9; background: #fff; border: 1px solid var(--ink); border-radius: 3px; }
#foot { grid-area: foot; display: flex; align-items: center; gap: 22px; padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
#foot b { font-weight: 600; }
#warn { color: var(--danger); margin-left: auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

dialog { border: 0; border-radius: 4px; padding: 22px; width: min(880px, calc(100vw - 32px)); box-shadow: 0 8px 40px rgba(20, 30, 35, .3); color: var(--ink); }
dialog::backdrop { background: rgba(32, 38, 42, .45); }
#cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
.card { text-align: left; background: var(--canvas); border: 1px solid transparent; border-radius: 3px; padding: 10px; cursor: pointer; }
.card:hover { border-color: var(--ink); background: var(--tape); }
.card svg { display: block; width: 100%; height: 110px; margin-bottom: 8px; }
.card b { display: block; font-weight: 600; }
.card span { font-size: 13px; color: var(--soft); }
.card:hover span { color: var(--ink); }

#pack { display: none; position: fixed; inset: 0; background: #fff; overflow-y: auto; z-index: 5; padding: 0 28px 40px; }
#pack.open { display: block; }
#packTop { position: sticky; top: 0; background: #fff; display: flex; gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
#pack h2 { font-size: 20px; margin: 26px 0 10px; }
#pack table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
#pack th, #pack td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
#pack th { font-weight: 600; }
#pack td.n { text-align: right; }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; }
.sheets svg, .draws svg { width: 100%; height: auto; display: block; }
.draws { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 18px; }
#packNotes li { margin-bottom: 6px; max-width: 75ch; }
@media print {
  #app, #packTop { display: none !important; }
  #pack { position: static; display: block; padding: 0; overflow: visible; }
  .sheets, .draws { display: block; }
  .sheets > div, .draws > div { break-inside: avoid; margin-bottom: 14px; }
}
@media (max-width: 1050px) {
  body { overflow: auto; }
  #app { height: auto; grid-template: 52px 62vh 52vh auto 34px / 76px minmax(0, 1fr); grid-template-areas: 'top top' 'tools front' 'tools third' 'side side' 'foot foot'; }
  #work { display: contents; }
  #paneFront { grid-area: front; } #pane3d { grid-area: third; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #top { overflow-x: auto; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <input id="pname" aria-label="Project name">
    <div class="sep"></div>
    <button class="btn" id="bNew">New</button>
    <button class="btn" id="bOpen">Open</button>
    <button class="btn" id="bSave">Save</button>
    <input type="file" id="fileIn" accept=".json" hidden>
    <div class="sep"></div>
    <button class="btn" id="bUndo" title="Ctrl+Z">Undo</button>
    <button class="btn" id="bRedo" title="Ctrl+Y">Redo</button>
    <div class="grow"></div>
    <div class="seg" role="group" aria-label="Units">
      <button id="uIn">Inches</button><button id="uMm">mm</button>
    </div>
    <button class="btn main" id="bPack">Cut list and plans</button>
  </header>
  <nav id="tools" aria-label="Tools"></nav>
  <main id="work">
    <section class="pane" id="paneFront">
      <div id="unitTabs"></div>
      <svg id="front" role="img" aria-label="Front view"></svg>
      <div id="hint"></div>
    </section>
    <section class="pane" id="pane3d">
      <div id="view3d"></div>
      <div id="opts3d">
        <label><input type="checkbox" id="oItems" checked> Objects</label>
        <label><input type="checkbox" id="oWalls" checked> Walls</label>
        <label><input type="checkbox" id="oBack" checked> Back panels</label>
        <button class="btn line" id="bView">Reset view</button>
      </div>
    </section>
  </main>
  <aside id="side"></aside>
  <footer id="foot">
    <span id="fSize"></span><span id="fBoards"></span><span id="fSheets"></span><span id="fBand"></span>
    <span id="warn"></span>
  </footer>
</div>

<dialog id="newDlg">
  <div style="display:flex;align-items:center"><h2 style="margin:0">What are you making?</h2><span class="grow"></span><button class="btn line" id="newClose">Close</button></div>
  <p class="note">Pick the closest one. You can change everything afterwards.</p>
  <div id="cat"></div>
</dialog>

<section id="pack" aria-label="Cut list and plans">
  <div id="packTop">
    <button class="btn line" id="packBack">Back to design</button>
    <span class="grow"></span>
    <button class="btn line" id="bCsv">Download cut list</button>
    <button class="btn main" id="bPrint">Print or save PDF</button>
  </div>
  <div id="packBody"></div>
</section>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
// ---------- project ----------
// A unit is a box whose inside is a tree of openings. Adding a shelf or divider splits an opening, so boards
// can't overlap or float. Sizes are mm; parts[0] is the bottom (h split) or left (v split).
const leaf = (front = null) => ({ front, fill: 'auto' });
const hs = (sizes, parts) => ({ dir: 'h', sizes, parts: parts || sizes.map(() => leaf()) });
const vs = (sizes, parts) => ({ dir: 'v', sizes, parts: parts || sizes.map(() => leaf()) });
const unit = o => ({ name: 'Unit', w: 900, h: 1800, d: 300, kick: 75, sideL: true, sideR: true, top: true, bottom: true, back: true, endCover: true, place: 'right', root: leaf(), ...o });
const newProject = (name, units, o = {}) => ({ name, units, in: true, T: 19.05, BT: 19.05, SL: 2438.4, SW: 1219.2, color: 'white', wallA: 3000, wallB: 2000, gap: 40, ...o });

function equalFit(u, n, dir) {   // n openings sharing the unit evenly
  const i = interiorOf(u, 19.05), T = 19.05, tot = dir === 'h' ? i.z1 - i.z0 : i.x1 - i.x0, s = (tot - (n - 1) * T) / n;
  return Array(n).fill(s);
}
function tpl(o, build) { const u = unit(o); u.root = build(u); return u; }
const TEMPLATES = [
  { name: 'Bookshelf', sub: 'Tall, with five shelves', make: () => newProject('Bookshelf', [tpl({ name: 'Bookshelf', w: 800, h: 1980, d: 300 }, u => hs(equalFit(u, 6, 'h')))]) },
  { name: 'Corner rack', sub: 'Your L-shaped Design 3', make: () => newProject('Corner rack', [
    tpl({ name: 'Wing A', w: 1260, h: 992.15, d: 520, sideR: false, endCover: false, place: 'first' }, () => hs([530, 330], [vs([510, 711.9]), vs([517.88, 704.02])])),
    tpl({ name: 'Wing B', w: 800, h: 1853, d: 300, sideL: true, sideR: false, place: 'corner' }, () => hs([530, 330, 270, 270, 263.7], [322.38, 439.52, 322.38, 439.52, 322.38].map(a => vs([a, 780.95 - 19.05 - a])))),
  ], { wallA: 1600, wallB: 940 }) },
  { name: 'Cupboard', sub: 'Shelves behind two doors', make: () => newProject('Cupboard', [tpl({ name: 'Cupboard', w: 1000, h: 1980, d: 500 }, u => {
    const s = equalFit(u, 2, 'v'); return vs(s, [0, 1].map(() => { const x = hs(equalFit(u, 4, 'h')); x.front = 'door'; return x; }));
  })]) },
  { name: 'Chest of drawers', sub: 'Four drawers', make: () => newProject('Chest of drawers', [tpl({ name: 'Chest', w: 800, h: 900, d: 450 }, u => { const x = hs(equalFit(u, 4, 'h')); x.parts.forEach(p => { p.front = 'drawer'; }); return x; })]) },
  { name: 'Desk', sub: 'Drawers on one side, knee room', make: () => newProject('Desk', [tpl({ name: 'Desk', w: 1200, h: 750, d: 600, kick: 0, bottom: false, back: false }, u => {
    const i = interiorOf(u, 19.05), W = i.x1 - i.x0, H = i.z1 - i.z0, a = 400;
    const stack = hs(Array(3).fill((H - 2 * 19.05 - 80) / 3).concat(0).slice(0, 3)); stack.sizes[0] += 80; stack.parts.forEach(p => { p.front = 'drawer'; });
    const knee = leaf(); knee.fill = 'none';
    return vs([W - 19.05 - a, a], [knee, stack]);
  })]) },
  { name: 'TV unit', sub: 'Low, with doors each side', make: () => newProject('TV unit', [tpl({ name: 'TV unit', w: 1800, h: 500, d: 400, kick: 60 }, u => {
    const parts = [leaf('door'), leaf(), leaf('door')]; return vs(equalFit(u, 3, 'v'), parts);
  })]) },
  { name: 'Shoe rack', sub: 'Narrow, low shelves', make: () => newProject('Shoe rack', [tpl({ name: 'Shoe rack', w: 800, h: 900, d: 300 }, u => hs(equalFit(u, 5, 'h')))]) },
  { name: 'Empty box', sub: 'Start from nothing', make: () => newProject('My furniture', [unit({ name: 'Unit', w: 900, h: 900, d: 400 })]) },
];

let P, cur = 0, tool = 'select', sel = null, hover = null, drag = null;
const undoS = [], redoS = [];
const U = () => P.units[cur];
const T = () => P.T;

function interiorOf(u, t) { return { x0: u.sideL ? t : 0, x1: u.w - (u.sideR ? t : 0), z0: u.kick + (u.bottom ? t : 0), z1: u.h - (u.top ? t : 0) }; }
const interior = u => interiorOf(u, P.T);
function layout(u) {
  const t = P.T, i = interior(u), leaves = [], divs = [], fronts = [];
  (function go(n, x, z, w, h, path, cover) {
    if (n.front) { fronts.push({ n, x, z, w, h, path }); cover = path; }
    if (!n.parts) { leaves.push({ n, x, z, w, h, path, cover }); return; }
    let p = n.dir === 'h' ? z : x;
    n.parts.forEach((c, j) => {
      const s = n.sizes[j];
      if (n.dir === 'h') go(c, x, p, w, s, [...path, j], cover); else go(c, p, z, s, h, [...path, j], cover);
      p += s;
      if (j < n.parts.length - 1) {
        divs.push(n.dir === 'h' ? { kind: 'shelf', x, z: p, w, h: t, path, i: j, start: p - s, behind: !!cover } : { kind: 'divider', x: p, z, w: t, h, path, i: j, start: p - s, behind: !!cover });
        p += t;
      }
    });
  })(u.root, i.x0, i.z0, i.x1 - i.x0, i.z1 - i.z0, [], null);
  return { leaves, divs, fronts, i };
}
const nodeAt = (u, path) => path.reduce((n, j) => n.parts[j], u.root);
const samePath = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
function minSize(n, across) {
  const t = P.T;
  if (!n.parts) return 50;
  const along = (n.dir === 'h') !== !!across;   // across = width of this node
  const m = n.parts.map(c => minSize(c, across));
  return along ? m.reduce((a, b) => a + b, 0) + t * (n.parts.length - 1) : Math.max(...m);
}
function fit(n, w, h) {
  if (!n.parts) return;
  const t = P.T, tot = (n.dir === 'h' ? h : w) - t * (n.parts.length - 1), sum = n.sizes.reduce((a, b) => a + b, 0);
  n.sizes = n.sizes.map(s => s * tot / (sum || 1));
  n.parts.forEach((c, j) => n.dir === 'h' ? fit(c, w, n.sizes[j]) : fit(c, n.sizes[j], h));
}
function refit(u) { const i = interior(u); fit(u.root, i.x1 - i.x0, i.z1 - i.z0); }

// ---------- editing ----------
function edit(fn) {
  undoS.push(JSON.stringify(P)); if (undoS.length > 200) undoS.shift(); redoS.length = 0;
  fn(); persist(); render();
}
function persist() { try { localStorage.setItem('furniture-project', JSON.stringify(P)); } catch (e) {} }
function undo() { if (!undoS.length) return; redoS.push(JSON.stringify(P)); P = JSON.parse(undoS.pop()); afterSwap(); }
function redo() { if (!redoS.length) return; undoS.push(JSON.stringify(P)); P = JSON.parse(redoS.pop()); afterSwap(); }
function afterSwap() { sel = null; cur = Math.min(cur, P.units.length - 1); persist(); render(); }

function splitLeaf(u, l, dir, at) {   // at = size of the first new opening
  const t = P.T, tot = dir === 'h' ? l.h : l.w, a = at, b = tot - a - t, old = l.n;
  const door = old.front === 'door', mk = () => ({ front: door ? null : old.front, fill: old.fill });
  const parent = l.path.length ? nodeAt(u, l.path.slice(0, -1)) : null, j = l.path.at(-1);
  if (parent && parent.dir === dir && !door) {
    parent.parts.splice(j, 1, mk(), mk()); parent.sizes.splice(j, 1, a, b);
  } else {
    const s = { dir, sizes: [a, b], parts: [mk(), mk()], front: door ? 'door' : null };
    if (parent) parent.parts[j] = s; else u.root = s;
  }
}
function splitEven(u, l, dir, n) {
  const t = P.T, tot = dir === 'h' ? l.h : l.w, s = (tot - (n - 1) * t) / n, old = l.n;
  const parent = l.path.length ? nodeAt(u, l.path.slice(0, -1)) : null, j = l.path.at(-1);
  const door = old.front === 'door', made = Array.from({ length: n }, () => ({ front: door ? null : old.front, fill: old.fill }));
  if (parent && parent.dir === dir && !door) { parent.parts.splice(j, 1, ...made); parent.sizes.splice(j, 1, ...Array(n).fill(s)); }
  else { const x = { dir, sizes: Array(n).fill(s), parts: made, front: door ? 'door' : null }; if (parent) parent.parts[j] = x; else u.root = x; }
}
function removeDiv(u, d) {
  const n = nodeAt(u, d.path), t = P.T, a = n.parts[d.i], b = n.parts[d.i + 1];
  const size = n.sizes[d.i] + n.sizes[d.i + 1] + t;
  const keep = a.parts && (!b.parts || n.sizes[d.i] >= n.sizes[d.i + 1]) ? a : b.parts ? b : leaf(a.front === b.front ? a.front : null);
  n.parts.splice(d.i, 2, keep); n.sizes.splice(d.i, 2, size);
  if (n.parts.length === 1) {   // a split with one child is just that child
    const c = n.parts[0];
    if (n.front && !c.front) c.front = n.front;
    if (d.path.length) { const par = nodeAt(u, d.path.slice(0, -1)); par.parts[d.path.at(-1)] = c; } else u.root = c;
  }
  refit(u);
}
function setDivPos(u, d, first) {   // first = new size of the opening before the board
  const n = nodeAt(u, d.path), tot = n.sizes[d.i] + n.sizes[d.i + 1];
  const min1 = minSize(n.parts[d.i], n.dir === 'v'), min2 = minSize(n.parts[d.i + 1], n.dir === 'v');
  const a = Math.max(min1, Math.min(tot - min2, first));
  n.sizes[d.i] = a; n.sizes[d.i + 1] = tot - a;
  refit(u);
}
function liveDiv(u) { return layout(u).divs.find(x => sel && samePath(x.path, sel.path) && x.i === sel.i); }
function liveLeaf(u) { return layout(u).leaves.find(x => sel && samePath(x.path, sel.path)); }
function setUnitSize(u, k, v) {
  const t = P.T;
  if (k === 'w' || k === 'h') {
    const i = interior(u), cur_ = k === 'w' ? i.x1 - i.x0 : i.z1 - i.z0, frame = u[k] - cur_;
    u[k] = Math.max(minSize(u.root, k === 'w') + frame, v);
  } else u[k] = Math.max(k === 'kick' ? 0 : 2 * t + 60, v);
  refit(u);
}

// ---------- units ----------
const inchText = mm => {
  const e = Math.round(mm / 25.4 * 8), w = Math.floor(e / 8), f = e % 8;
  if (!f) return w + '"';
  let n = f, d = 8; while (n % 2 === 0) { n /= 2; d /= 2; }
  return (w ? w + ' ' : '') + n + '/' + d + '"';
};
const fmt = mm => P.in ? inchText(mm) : Math.round(mm * 10) / 10 + ' mm';
const fmtBare = mm => P.in ? inchText(mm).replace('"', '') : String(Math.round(mm * 10) / 10);
function parseLen(s) {
  s = String(s).replace(/["”]|mm|in/g, '').trim();

  let s = `<line x1="${X(right - P.wallA)}" y1="${Z(-G)}" x2="${X(right)}" y2="${Z(-G)}" stroke="#20262a" stroke-width="4"/><line x1="${X(right)}" y1="${Z(-G)}" x2="${X(right)}" y2="${Z(P.wallB - G)}" stroke="#20262a" stroke-width="4"/>`;
  P.units.forEach((u, i) => {
    const [x0, x1, , , z0, z1] = worldBox(u, pl[i], [0, u.w, 0, u.d, 0, 0]);
    s += `<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1 - x0) * k}" height="${(z1 - z0) * k}" fill="${MAT[P.color].f}" stroke="#20262a"/><text x="${X((x0 + x1) / 2)}" y="${Z((z0 + z1) / 2) + 4}" font-family="Barlow, sans-serif" font-size="12" text-anchor="middle" ${pl[i].corner ? `transform="rotate(-90 ${X((x0 + x1) / 2)} ${Z((z0 + z1) / 2)})"` : ''}>${esc(u.name)}: ${fmt(u.w)} × ${fmt(u.d)}</text>`;
  });
  s += `<text x="${X(right - P.wallA / 2)}" y="${Z(-G) - 8}" font-family="Barlow, sans-serif" font-size="12" text-anchor="middle">Back wall ${fmt(P.wallA)}, gap ${fmt(G)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:760px">${s}</svg>`;
}
function renderPack() {
  const bs = allBoards(), rows = cutRows(bs);
  const num = v => P.in ? inchText(v) : Math.round(v * 10) / 10;
  let h = `<h1 style="font-size:28px;font-weight:600;margin:0">${esc(P.name)}</h1><p class="note" style="font-size:15px">Everything your woodworker needs. Sizes are finished sizes${P.in ? ', in inches' : ', in mm'}.</p>`;
  h += `<h2>Where it goes</h2>${topView()}`;
  h += `<h2>Front views</h2><div class="draws">${P.units.map((u, i) => `<div><b>${esc(u.name)}</b>${staticFront(u, 560, 500, { dims: true, labels: true, idx: i, mono: true, pad: 60 })}</div>`).join('')}</div>`;
  h += `<h2>Cut list</h2><table><tr><th>Part</th><th>Marked</th><th>How many</th><th>Length</th><th>Width</th><th>Thickness</th><th>Edge banding</th></tr>`;
  rows.forEach(r => { h += `<tr><td>${r.part}</td><td>${r.ids.join(', ')}</td><td class="n">${r.qty}</td><td class="n">${num(r.len)}</td><td class="n">${num(r.wid)}</td><td class="n">${num(r.thk)}</td><td>${bandLabel(r)}</td></tr>`; });
  h += `</table>`;
  h += `<h2>Cutting plan</h2><p class="note" style="font-size:15px">Rip each sheet into strips along its length, then cross-cut the parts. Allows 4 mm for each saw cut. Grey is offcut.</p>`;
  thicknesses(rows).forEach(t => {
    const { sheets, over } = packSheets(rows, t);
    h += `<h3>${num(t)} board: ${sheets.length} ${sheets.length === 1 ? 'sheet' : 'sheets'}</h3><div class="sheets">`;
    sheets.forEach((sh, i) => {
      let v = `<rect x="0" y="0" width="${P.SL}" height="${P.SW}" fill="#eceeed" stroke="#5c686e" stroke-width="3"/>`;
      sh.strips.forEach(st => st.parts.forEach(q => {
        const fs = Math.max(20, Math.min(52, q.w * .3, q.l / 7)), cx = q.x + q.l / 2, cy = q.y + q.w / 2;
        v += `<rect x="${q.x}" y="${q.y}" width="${q.l}" height="${q.w}" fill="#fff" stroke="#20262a" stroke-width="3"/>`;
        v += q.w >= 150 ? `<text x="${cx}" y="${cy}" font-family="Barlow,sans-serif" font-size="${fs}" font-weight="600" text-anchor="middle">${q.id}</text><text x="${cx}" y="${cy + fs}" font-family="Barlow,sans-serif" font-size="${fs * .8}" text-anchor="middle">${esc(fmtBare(q.l))} × ${esc(fmtBare(q.w))}</text>`
          : `<text x="${cx}" y="${cy + 8}" font-family="Barlow,sans-serif" font-size="${Math.min(40, q.w * .7)}" text-anchor="middle">${q.id}  ${esc(fmtBare(q.l))} × ${esc(fmtBare(q.w))}</text>`;
      }));
      h += `<div><div>Sheet ${i + 1}</div><svg viewBox="-10 -10 ${P.SL + 20} ${P.SW + 20}">${v}</svg></div>`;
    });
    h += `</div>`;
    if (over.length) h += `<p style="color:var(--danger)">Too big for one sheet, so these need a joint: ${over.map(q => q.id).join(', ')}.</p>`;
  });
  const hasDoor = bs.some(b => b.part === 'Door'), hasDrawer = bs.some(b => b.part === 'Drawer front');
  const notes = [
    'Edge-band every edge listed in the cut list.',
    `The back is ${num(P.BT)} board, screwed to the rear of the box and covering the whole back.`,
    ...(hasDoor ? ['Doors sit inside the opening with a 2 mm gap all round. Choose hinges with your woodworker.'] : []),
    ...(hasDrawer ? ['Drawer fronts sit inside the opening with a 2 mm gap all round. Drawer boxes allow 13 mm each side for side-mount slides. Check against the slides you buy.'] : []),
    `Measure the walls at floor and at full height before cutting. Walls are rarely square. Fix tall units to the wall so they can't tip.`,
    ...checks().map(w => 'To check: ' + w),
  ];
  h += `<h2>Notes</h2><ul id="packNotes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
  document.getElementById('packBody').innerHTML = h;
}
document.getElementById('bPack').onclick = () => { renderPack(); document.getElementById('pack').classList.add('open'); };
document.getElementById('packBack').onclick = () => document.getElementById('pack').classList.remove('open');
document.getElementById('bPrint').onclick = () => window.print();
document.getElementById('bCsv').onclick = () => {
  const n = v => P.in ? Math.round(v / 25.4 * 8) / 8 : v, unitName = P.in ? 'in' : 'mm';
  const body = cutRows(allBoards()).map(r => [`"${r.part}"`, `"${r.ids.join(' ')}"`, r.qty, n(r.len), n(r.wid), n(r.thk), `"${bandLabel(r).replace('—', '')}"`].join(',')).join('\n');
  download(`${P.name} cut list.csv`, `Part,Marked,How many,Length ${unitName},Width ${unitName},Thickness ${unitName},Edge banding\n${body}`, 'text/csv');
};
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); }

// ---------- top bar ----------
const dlg = document.getElementById('newDlg');
function loadProject(p) { P = p; cur = 0; sel = null; tool = 'select'; undoS.length = 0; redoS.length = 0; camSet = false; persist(); render(); }
document.getElementById('bNew').onclick = () => { fillCatalog(); dlg.showModal(); };
document.getElementById('newClose').onclick = () => dlg.close();
function fillCatalog() {
  const prev = P; const cat = document.getElementById('cat');
  cat.innerHTML = '';
  TEMPLATES.forEach(t => {
    const p = t.make(); P = p; refitAll();
    const b = document.createElement('button'); b.className = 'card';
    const pl = places(), e = extents();
    const k = 1;
    b.innerHTML = `<svg viewBox="0 0 220 120">${thumb(p)}</svg><b>${t.name}</b><span>${t.sub}</span>`;
    b.onclick = () => { dlg.close(); const fresh = t.make(); P = fresh; refitAll(); loadProject(fresh); };
    cat.appendChild(b);
  });
  P = prev;
}
function refitAll() { P.units.forEach(refit); }
function thumb(p) {   // every unit of the project side by side, in its true proportions
  const totalW = p.units.reduce((a, u) => a + u.w + 80, -80), maxH = Math.max(...p.units.map(u => u.h)), k = Math.min(200 / totalW, 104 / maxH);
  let x = (220 - totalW * k) / 2, s = '';
  p.units.forEach(u => {
    const svg = staticInner(u, k, x, 112); s += svg; x += (u.w + 80) * k;
  });
  return s;
}
function staticInner(u, k, ox, oy) {
  const X = s => ox + s * k, Y = z => oy - z * k, { fronts, divs, i } = layout(u), t = Math.max(P.T, 1.4 / k), f = '#20262a';
  const R = (x, z, a, b, fill = f) => `<rect x="${X(x)}" y="${Y(z + b)}" width="${a * k}" height="${b * k}" fill="${fill}"/>`;
  let s = R(0, 0, u.w, u.h, '#fff');
  if (u.top) s += R(0, u.h - t, u.w, t);
  if (u.bottom) s += R(0, u.kick, u.w, t);
  if (u.kick) s += R(0, 0, u.w, u.kick, '#5c686e');
  if (u.sideL) s += R(0, 0, t, u.h);
  if (u.sideR) s += R(u.w - t, 0, t, u.h);
  divs.forEach(d => { s += d.kind === 'shelf' ? R(d.x, d.z, d.w, t) : R(d.x, d.z, t, d.h); });
  fronts.forEach(l => { s += `<rect x="${X(l.x + 8)}" y="${Y(l.z + l.h - 8)}" width="${(l.w - 16) * k}" height="${(l.h - 16) * k}" fill="#c7cfcc" fill-opacity=".6"/>`; });
  return s;
}
document.getElementById('bOpen').onclick = () => document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const p = JSON.parse(await f.text());
    if (!p.units || !p.units.length) throw new Error('no furniture in it');
    loadProject(p);
  } catch (err) { document.getElementById('warn').textContent = `Couldn't open ${f.name}: ${err.message}. Choose a file saved from here.`; }
};
document.getElementById('bSave').onclick = () => download(`${P.name}.json`, JSON.stringify(P, null, 1), 'application/json');
document.getElementById('bUndo').onclick = undo; document.getElementById('bRedo').onclick = redo;
document.getElementById('uIn').onclick = () => { P.in = true; persist(); render(); };
document.getElementById('uMm').onclick = () => { P.in = false; persist(); render(); };
const pname = document.getElementById('pname');
pname.onchange = () => { if (pname.value.trim()) edit(() => { P.name = pname.value.trim(); }); else render(); };
pname.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') pname.blur(); };

window.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox';
  if (document.getElementById('pack').classList.contains('open') || dlg.open || typing) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); document.getElementById('bSave').click(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = TOOLS.find(x => x[2].toLowerCase() === k); if (t) { setTool(t[0]); return; }
  if (k === 'escape') { endPlace(); tool = 'select'; sel = null; hover = null; render(); return; }
  const u = U();
  if ((k === 'delete' || k === 'backspace') && sel) {
    e.preventDefault();
    if (sel.kind === 'div') { const d = liveDiv(u); edit(() => { removeDiv(u, d); sel = null; }); }
    else if (sel.kind === 'item') edit(() => { u.items = itemsOf(u).filter(i => i.id !== sel.id); sel = null; });
    else if (sel.kind === 'part') edit(() => { deletePart(u, sel.key); sel = null; });
    else if (sel.kind === 'leaf') { const l = liveLeaf(u); if (l && l.cover) edit(() => { nodeAt(u, l.cover).front = null; }); }
    return;
  }
  if (sel && sel.kind === 'div' && k.startsWith('arrow')) {
    const d = liveDiv(u), n = nodeAt(u, d.path), st = snapStep();
    const dv = (d.kind === 'shelf' ? { arrowup: 1, arrowdown: -1 } : { arrowright: 1, arrowleft: -1 })[k];
    if (dv) { e.preventDefault(); edit(() => setDivPos(u, liveDiv(u), n.sizes[d.i] + dv * st)); }
  }
});
new ResizeObserver(() => { size3D(); if (P) drawFront(); }).observe(document.getElementById('work'));

// ---------- start ----------
let saved = null;
try { saved = JSON.parse(localStorage.getItem('furniture-project')); } catch (e) {}
P = saved && saved.units ? saved : TEMPLATES[1].make();
size3D();
render();
if (!saved) { fillCatalog(); dlg.showModal(); }
</script>
